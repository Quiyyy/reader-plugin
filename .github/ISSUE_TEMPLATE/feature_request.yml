name: 功能建议
description: 说明希望改善的阅读、学习或记录体验
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你想完成什么？目前在哪一步遇到困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望的体验
      description: 描述结果即可，也可以附示意图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法或其他方案（可选）
