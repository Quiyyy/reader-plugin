name: Reader checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: reader-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 24 }
          - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Reader Windows 中文
    steps:
      - uses: actions/checkout@v4
        with:
          path: Reader Windows 中文
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: Reader Windows 中文/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        timeout-minutes: 5
      - run: npx playwright install chromium
        if: runner.os != 'Linux'
        timeout-minutes: 5
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            Reader Windows 中文/artifacts/
            Reader Windows 中文/test-results/
